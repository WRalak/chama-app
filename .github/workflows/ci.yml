name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chamahub
          POSTGRES_PASSWORD: chamahub
          POSTGRES_DB: chamahub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chamahub" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://chamahub:chamahub@localhost:5432/chamahub_test
      TEST_DATABASE_URL: postgresql://chamahub:chamahub@localhost:5432/chamahub_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chamahub/shared build
      - name: Shared finance unit tests
        run: pnpm --filter @chamahub/shared test
      - name: Apply migrations
        run: pnpm --filter @chamahub/api exec prisma migrate deploy
      - name: Typecheck
        run: |
          pnpm --filter @chamahub/api typecheck
          pnpm --filter @chamahub/admin typecheck
          pnpm --filter @chamahub/mobile typecheck
      - name: API e2e tests (auth, authorization, ledger, idempotency)
        run: pnpm --filter @chamahub/api test
      - name: Build admin
        run: pnpm --filter @chamahub/admin build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
