name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chamahub
          POSTGRES_PASSWORD: chamahub
          POSTGRES_DB: chamahub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chamahub" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://chamahub:chamahub@localhost:5432/chamahub_test
      TEST_DATABASE_URL: postgresql://chamahub:chamahub@localhost:5432/chamahub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @chamahub/shared
      - name: Shared finance unit tests
        run: npm run test -w @chamahub/shared
      - name: Apply migrations
        run: npm exec -w @chamahub/api -- prisma migrate deploy
      - name: Typecheck
        run: |
          npm run typecheck -w @chamahub/api
          npm run typecheck -w @chamahub/admin
          npm run typecheck -w @chamahub/mobile
      - name: API e2e tests (auth, authorization, ledger, idempotency)
        run: npm run test -w @chamahub/api
      - name: Build admin
        run: npm run build -w @chamahub/admin
        env:
          NEXT_TELEMETRY_DISABLED: '1'
