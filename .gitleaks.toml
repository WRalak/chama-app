# Secret scanning config (CI: .github/workflows/security.yml). Starts from gitleaks' default rules.
[extend]
useDefault = true

# Tests now generate their passwords at run time (backend/test/helpers.ts testPassword()), so no
# password literals remain in the tree. Commits made before that change still hold throwaway e2e
# passwords under backend/test; this allowlist covers those history entries only for the generic
# "looks like a key" rule. Provider-specific rules (AWS, Stripe, Supabase JWTs, private keys...) still apply.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "e2e test passwords"
paths = ['''^backend/test/''']
